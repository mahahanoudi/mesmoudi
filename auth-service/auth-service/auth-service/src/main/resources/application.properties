server.port=8081
spring.application.name=auth-service

# Database Configuration (MySQL via XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/tetouan_tourism_auth?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Clerk JWT Configuration
# IMPORTANT: L'URL JWKS doit correspondre a votre compte Clerk
# Si vous voyez une erreur de validation JWT, verifiez cette URL
# Format: https://[votre-clerk-id].clerk.accounts.dev/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://flowing-crawdad-79.clerk.accounts.dev/.well-known/jwks.json

# Logging
logging.level.com.example.auth_service=DEBUG
logging.level.org.springframework.security=DEBUG
